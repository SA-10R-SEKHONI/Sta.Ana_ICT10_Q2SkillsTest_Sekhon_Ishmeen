<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- PyScript -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2025.7.3/core.css">

    <script
        type="module"
        src="https://pyscript.net/releases/2025.7.3/core.js">
    </script>

    <title>SÉRAVI</title>

    <style>

        /* Background */

        body {
            background:
                linear-gradient(
                    rgba(5, 10, 29, 0.40),
                    rgba(5, 10, 29, 0.72)
                ),
                url("bg.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
            font-family: Georgia, serif;
        }

        /* Main Card */

        .card {
            border: 1px solid rgba(190, 199, 255, 0.35);
            border-radius: 18px;
            background: rgba(12, 19, 48, 0.88);
            backdrop-filter: blur(10px);
        }

        .card-header {
            border-radius: 18px 18px 0 0 !important;
            background: rgba(18, 29, 67, 0.95);
            color: #dce4ff;
            border-bottom: 1px solid #697cae;
        }

        .card-header h2 {
            letter-spacing: 5px;
            font-size: 32px;
        }

        .card-header i {
            color: #b9caff;
        }

        .card-body {
            color: #e3e8ff;
        }

        .instructions {
            background-color: rgba(55, 69, 116, 0.45);
            color: #e0e5ff;
            border: 1px solid rgba(180, 193, 255, 0.35);
        }


        /* Input Field */

        .form-label {
            color: #d0d9ff;
        }

        .form-control {
            background-color: rgba(10, 17, 43, 0.9);
            color: white;
            border: 1px solid #7588bd;
        }

        .form-control:focus {
            background-color: rgba(10, 17, 43, 0.95);
            color: white;
            border-color: #c3d2ff;
            box-shadow: 0 0 8px rgba(157, 180, 255, 0.25);
        }

        .form-control::placeholder {
            color: #a1accb;
        }

        /* Search Button */

        .search-btn {
            background-color: #aebee8;
            color: #111b3d;
            border: none;
            transition: 0.3s;
        }

        .search-btn:hover {
            background-color: #d5dcff;
            color: #111b3d;
        }

        /* Result Part */

        #result {
            min-height: 120px;
            font-size: 1.05rem;
            background-color: rgba(19, 28, 61, 0.9);
            color: #e6eaff;
            border-left: 5px solid #aebee8;
        }

        #result hr {
            border-color: #8294c9;
        }

        #result h4,
        #result h5 {
            color: #c7d4ff !important;
        }

        #result strong {
            color: #b9caff;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #bdc9ed;
            background-color: rgba(18, 29, 67, 0.95);
            border-radius: 0 0 18px 18px;
            border-top: 1px solid #697cae;
        }


        @media (max-width: 768px) {

            body {
                background-attachment: scroll;
                background-position: center top;
            }

        }

    </style>

</head>


<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg">

                <div class="card-header text-center p-4">

                    <h2>SÉRAVI</h2>

                    <p class="mb-0">
                        Perfume Information Beholder
                    </p>

                </div>


                <div class="card-body p-4">


                    <div class="alert instructions">

                        <strong>Instructions:</strong><br>

                        Enter the <b>name</b> of a perfume
                        to unlock its information.

                        <br>

                        <small>
                            Examples: Golden Hour, Black Opium, Sauvage, Goddess
                        </small>

                    </div>


                    <!-- Search Form -->

                    <form>

                        <div class="mb-3">

                            <label
                                class="form-label fw-bold">

                                <i class="bi bi-search"></i>
                                Perfume Name

                            </label>


                            <input
                                type="text"
                                id="perfume_name"
                                class="form-control form-control-lg"
                                placeholder="Enter perfume name here">

                        </div>


                        <!-- Search Button -->

                        <div class="d-grid">

                            <input
                                type="button"
                                py-click="perfume_checker"
                                value="Explore Perfume"
                                class="btn search-btn btn-lg">

                        </div>

                    </form>


                    <hr>


                    <h5 style="color: #c7d4ff;">

                        <i class="bi bi-moon-stars-fill"></i>
                        Perfume Details

                    </h5>


                    <div
                        id="result"
                        class="rounded p-3 shadow-sm">

                    </div>


                </div>


<!-- Connects the Python File -->

<py-script src="main.py"></py-script>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
